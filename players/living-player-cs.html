:root{--bg:#000;--chip:#262626;--chipfg:#F4E8CC;--chipline:#6b6455;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--chip:#262626;--chipfg:#F4E8CC}}
:root[data-theme="dark"]{--bg:#000;--chip:#262626;--chipfg:#F4E8CC}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body.idle{cursor:none}
#cv{display:block;width:100%;height:100%;object-fit:contain}
#ui{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:10px;border-radius:14px;background:var(--chip);opacity:0;transition:opacity .6s;pointer-events:none;max-width:calc(100vw - 24px)}
#ui.show{opacity:1;pointer-events:auto}
#ui button{font:600 19px/1 "EB Garamond",Georgia,serif;color:var(--chipfg);background:transparent;border:1.5px solid var(--chipline);border-radius:10px;padding:12px 18px;min-height:44px;cursor:pointer}
#ui .vol{display:flex;align-items:center;gap:8px;color:var(--chipfg);font:600 19px/1 "EB Garamond",Georgia,serif;padding:0 6px}
#ui select{font:600 18px/1 "EB Garamond",Georgia,serif;color:var(--chipfg);background:transparent;border:1.5px solid var(--chipline);border-radius:8px;padding:8px;min-height:44px}
#ui select option{color:#000}
#ui input[type=range]{width:140px;accent-color:#E3A92B}
#ui button:focus-visible,#ui select:focus-visible,#ui input:focus-visible{outline:2px solid var(--chipfg);outline-offset:2px}
#fps{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;font:600 14px/1 monospace;color:#F4E8CC;background:#262626;padding:4px 6px;border-radius:6px}
@media (prefers-reduced-motion: reduce){#ui{transition:none}}

<canvas id="cv" role="img" aria-label="Mr. Murphy’s Sustained Silent Reading: a slowly growing, living poster"></canvas>
<div id="ui"><button id="snd" type="button">Start sound</button><label class="vol"><span>Volume</span><input id="vol" type="range" min="0" max="100" value="70"></label><button id="tmr" type="button">Start timer</button><label class="vol"><span>Minutes</span><select id="tmin"><option>10</option><option>15</option><option selected>20</option><option>25</option><option>30</option></select></label><button id="pp" type="button">Pause</button><button id="fs" type="button">Fullscreen</button></div>

<script id="audiolib">

   effect tails wrap across the loop point (no seam). */
(function (G) {
  'use strict';
  const DHS = (G.DHS = G.DHS || {});
  const P = (DHS.dsp = {});
  const TAU = Math.PI * 2;

    const N = bus.N, gl = gain * Math.cos((pan + 1) * Math.PI / 4), gr = gain * Math.sin((pan + 1) * Math.PI / 4);
    let j = ((at % N) + N) % N;
    for (let i = 0; i < buf.length; i++) { bus.L[j] += buf[i] * gl; bus.R[j] += buf[i] * gr; if (++j === N) j = 0; }
  };

  // ADSR sampled into array of length n (gate = sustain duration in samples)

  // and keep the second pass, so filter/effect state at the seam is continuous.

 c.setTransform(S,0,0,S,0,0);c.translate(W/2,H/2-20);c.scale(k,k);c.drawImage(TK.cv,-TK.cw/2,-TK.ch/2,TK.cw,TK.ch)}
/* ================= time-left readout (top-right): yellow Bagel Fat One, updates in 10-second steps (Bryan, Oct 9) ================= */
// Shows while the session timer runs, on top of everything. The time is rounded UP to the step: a 20-min timer shows 20:00 for 10 s, then 19:50, 19:40 ...
// so students see roughly how long is left without watching seconds tick. Knobs: CLOCK.step (seconds per update), size, ink, edge, right/top margins. ?noclock hides it.
const CLOCK={step:10,size:92,ink:'#FFD100',edge:'#262626',edgeW:14,right:56,top:40};
const clockText=()=>{const rem=tm.done?0:Math.max(0,tm.dur-(Date.now()-tm.start)/1000),q=Math.ceil(rem/CLOCK.step-1e-9)*CLOCK.step;return Math.floor(q/60)+':'+String(q%60).padStart(2,'0')};
function drawClock(c){if(!tm.on||Q.has('noclock'))return;const s=clockText();c.save();c.setTransform(S,0,0,S,0,0);c.font='400 '+CLOCK.size+'px '+DISP;c.textAlign='right';c.textBaseline='alphabetic';c.lineJoin='round';
 const x=W-CLOCK.right,y=CLOCK.top+CLOCK.size*.82;c.lineWidth=CLOCK.edgeW;c.strokeStyle=CLOCK.edge;c.strokeText(s,x,y);c.fillStyle=CLOCK.ink;c.fillText(s,x,y);c.restore()}
/* ================= growth layer: drawn incrementally, scrolled by whole device pixels ================= */
function mkLayer(){const b=document.createElement('canvas');b.width=Math.ceil(LW*S);b.height=Math.ceil(H*S);return b}
function shift(dpx){const o=L2.getContext('2d');o.setTransform(1,0,0,1,0,0);o.clearRect(0,0,L2.width,L2.height);o.drawImage(L1,-dpx,0);[L1,L2]=[L2,L1];gl=L1.getContext('2d');gl.setTransform(S,0,0,S,0,0);
 const w=dpx/S;acc-=w;SH+=w;for(const v of vines){v.x-=w;for(const q of v.h)q[0]-=w;if(v.fiddle)v.tx-=w}for(const p of pops)p.x-=w;for(const F of FS){if(F.ax!==undefined)F.ax-=w;if(F.sx!==undefined)F.sx-=w}if(WD)for(const q of WD.h)q[0]-=w}
/* ================= simulation ================= */
function step(dt){T+=dt;G+=((CLS.length?.35:1)-G)*Math.min(1,dt*.7); // growth slows while text is up
 acc+=DRIFT*dt;const dpx=Math.floor(acc*S);if(dpx>=1)shift(dpx);gridScroll();
 const roots=vines.filter(v=>!v.depth&&!v.fiddle).length;if(roots<K.vine.cap&&R()<K.vine.rate*G*dt)spawnRoot();
 if(R()<K.discRate*G*dt)spawnDisc();
 if(!WARM&&!FS.length&&!CLS.length&&T>=nextF){startFiddle();nextF=Infinity}
 if(!WARM&&!WD&&T>=nextW&&(CLS.some(c=>c.phase==='hold')||(TRIO&&!CLS.length)))startWord(); // write words while a cluster is open, beside it (a trio fills too much, so CS also writes between blooms; the next trio steers clear)
 for(let i=0;i<vines.length;i++)if(vines[i].state!=='done')stepVine(vines[i],dt);
 vines=vines.filter(v=>v.state!=='done');
 for(let i=pops.length-1;i>=0;i--){const p=pops[i];if(WARM||T-p.born>=p.dur){drawPop(gl,p,1);pops.splice(i,1)}}
 stepFiddle();stepCluster(dt);stepWord(dt)}
function draw(){const c=ctx;c.setTransform(S,0,0,S,0,0);c.fillStyle=mixc('#17504D','#2A2E57',.5+.5*Math.sin(TAU*T/90));c.fillRect(0,0,W,H);
 c.setTransform(1,0,0,1,0,0);c.drawImage(L1,-acc*S,0);
 c.setTransform(S,0,0,S,-acc*S,0);for(const p of pops)drawPop(c,p,eout((T-p.born)/p.dur));for(const F of FS)if(F.phase!=='stem')drawTip(c,tipPts(F),F);
 drawTimer(c);if(!(tm.on&&tm.done&&TICKET))drawCluster(c);drawTicket(c);drawClock(c)}
function size(){const dpr=Math.min(devicePixelRatio||1,2),bw=Math.max(480,Math.min(W,Math.round(Math.min(innerWidth,innerHeight*16/9)*dpr)));if(bw===cv.width)return false;cv.width=bw;cv.height=Math.round(bw*9/16);S=bw/W;return true}
function init(seed){SEED=seed;R=mulberry(seed);field=makeField(mulberry(seed*7+1));T=0;SH=0;acc=0;G=1;vines=[];pops=[];FS=[];CLS=[];WD=null;cache={};TK=null;msgI=0;wordI=Math.floor(R()*4);
 grid=new Uint16Array(NC*NR);gLeft=Math.floor(-300/CELL);L1=mkLayer();L2=mkLayer();gl=L1.getContext('2d');gl.setTransform(S,0,0,S,0,0);
 WARM=true;for(let i=0;i<750;i++)step(1/30);WARM=false;nextF=T+.5;nextW=T+40} // pre-grow 25 s so it never starts empty
/* ================= controls: hidden until mouse move or tap, fade after 3 s ================= */
const ui=document.getElementById('ui'),pp=document.getElementById('pp'),fs=document.getElementById('fs');let hideT=0,paused=false;
function poke(){ui.classList.add('show');document.body.classList.remove('idle');clearTimeout(hideT);hideT=setTimeout(()=>{ui.classList.remove('show');document.body.classList.add('idle')},3000)}
function togglePause(){paused=!paused;pp.textContent=paused?'Play':'Pause'}
const de=document.documentElement,canFS=!!(de.requestFullscreen||de.webkitRequestFullscreen);
function toggleFS(){if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else(de.requestFullscreen||de.webkitRequestFullscreen).call(de)}
if(!canFS)fs.hidden=true;
pp.onclick=togglePause;fs.onclick=toggleFS;
addEventListener('mousemove',poke);addEventListener('pointerdown',poke);
addEventListener('keydown',e=>{poke();if(e.key===' '){togglePause();e.preventDefault()}else if((e.key==='f'||e.key==='F')&&canFS)toggleFS()});
document.body.classList.add('idle');
// resize / fullscreen in or out: keep everything (growth, cards on screen, words, timer) and only re-scale the canvases.
// Was init(SEED), which restarted the whole poster (Bryan, Oct 9). The growth layer is redrawn at the new scale; card art re-renders sharp on its next bloom.
function rescale(){const n1=mkLayer(),c=n1.getContext('2d');c.imageSmoothingQuality='high';c.drawImage(L1,0,0,n1.width,n1.height);
 L1=n1;L2=mkLayer();gl=L1.getContext('2d');gl.setTransform(S,0,0,S,0,0);for(const k in cache)delete cache[k];TK=null;draw()}
addEventListener('resize',()=>{if(size()&&L1)rescale()});
/* ================= main loop (uncapped; time-based, so frame rate never changes speed) ================= */
const fpsEl=document.getElementById('fps');if(Q.has('fps'))fpsEl.hidden=false;
let last=0,lastDraw=0,fc=0,fw=0,cost=0;
function frame(now){requestAnimationFrame(frame);if(!last)last=now;const dt=Math.min(.05,(now-last)/1000);last=now;
 if(paused){if(now-lastDraw>=250){lastDraw=now;draw()}return}
 const t0=performance.now();step(dt);draw();lastDraw=now;
 if(!fpsEl.hidden){cost+=performance.now()-t0;fc++;fw+=dt;if(fw>=1){fpsEl.textContent=`${Math.round(fc/fw)} fps · ${(cost/fc).toFixed(1)} ms`;fc=0;fw=0;cost=0}}}
// capture hooks: ?manual stops the loop; advance(seconds) steps at 60 Hz then draws one frame
window.advance=(sec,hz=60)=>{const n=Math.round(sec*hz);for(let i=0;i<n;i++)step(1/hz);draw()};
window.LIVING={ov:()=>{const CL=CLS[0];if(!LWB||!CL)return 0;const c=CL.cl,wx=LWB.x-SH,ox=Math.max(0,Math.min(CL.fx+c.vw/2,wx+LWB.w)-Math.max(CL.fx-c.vw/2,wx)),oy=Math.max(0,Math.min(CL.fy+c.vh/2,LWB.y+LWB.h)-Math.max(CL.fy-c.vh/2,LWB.y));return wx+LWB.w<0?0:ox*oy/(LWB.w*LWB.h)},dbg:()=>{const CL=CLS[0],F=FS[0];return{T:+T.toFixed(1),cl:CL&&CL.phase,clt0:CL&&+CL.t0.toFixed(1),clfx:CL&&Math.round(CL.fx),F:F&&F.phase,nextF:+(+nextF).toFixed(1),vines:vines.length,msgI,cards:CLS.length}},state:()=>({T,vines:vines.length,pops:pops.length,fiddle:FS[0]&&FS[0].phase,cluster:CLS[0]&&CLS[0].phase,word:!!WD,msgI})};
size();
window.ready=Promise.race([Promise.all(['400 100px "Bagel Fat One"','500 48px "EB Garamond"','600 48px "EB Garamond"','italic 400 48px "EB Garamond"',...VFONTS].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,3000))])
 .then(()=>{init(+Q.get('vseed')||((Date.now()%1e9)|0));if(!Q.has('manual'))requestAnimationFrame(frame);else draw()});
/* Sound + session-timer controls + wake lock for living-poster players.
   Needs in scope before it: Q (URLSearchParams), tm {on,start,dur,done,doneAt}, and the #snd #vol #tmr #tmin elements.
   Needs SSRM (ssr-music.js) loaded in <script id="audiolib"> so it can also start a Web Worker from that text. */
/* ---------- sound: generative, streamed in ~29 s sections; independent of the 80 s visual loop ---------- */
const snd={ctx:null,gain:null,started:false,playing:false,muted:false,vol:.7,seed:(+Q.get('seed'))||((Date.now()/1000)|0),next:0,nextT:0,ready:new Map(),pending:new Set(),mode:'none',worker:null,mq:[],job:null,pumping:false,firstAt:0};
window.SND=snd;
const sb=document.getElementById('snd'),vs=document.getElementById('vol');
function useMain(){if(snd.mode==='main')return;snd.mode='main';if(snd.worker){snd.worker.terminate();snd.worker=null}for(const i of snd.pending)snd.mq.push(i);pump()}
function setupRenderer(){
 if(!Q.has('noworker')){try{
  const src=document.getElementById('audiolib').textContent+'\nself.onmessage=e=>{const d=e.data;const s=SSRM.run(d);self.postMessage({index:d.index,L:s.L,R:s.R},[s.L.buffer,s.R.buffer])};self.postMessage({hello:1});';
  const w=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));snd.worker=w;
  w.onmessage=e=>{if(e.data.hello){snd.mode='worker';for(const i of snd.pending)w.postMessage({sr:48000,seed:snd.seed,index:i});return}got(e.data)};
  w.onerror=()=>{if(snd.mode!=='worker')useMain()};
  setTimeout(()=>{if(snd.mode==='none')useMain()},3000);return}catch(e){}}
 useMain()}
function request(i){if(snd.ready.has(i)||snd.pending.has(i))return;snd.pending.add(i);
 if(snd.mode==='worker')snd.worker.postMessage({sr:48000,seed:snd.seed,index:i});else if(snd.mode==='main'){snd.mq.push(i);pump()}}
// main-thread fallback: render in ~6 ms slices so the visuals keep running
function pump(){if(snd.pumping)return;snd.pumping=true;const step=()=>{
 if(!snd.job&&snd.mq.length){const i=snd.mq.shift();snd.job={i,g:SSRM.section({sr:48000,seed:snd.seed,index:i})}}
 if(!snd.job){snd.pumping=false;return}
 const end=performance.now()+6;while(performance.now()<end){const x=snd.job.g.next();if(x.done){const v=x.value;snd.job=null;got({index:v.index,L:v.L,R:v.R});break}}
 setTimeout(step,10)};step()}
function got(d){snd.pending.delete(d.index);snd.ready.set(d.index,d);schedule()}
function target(){return snd.muted?0:snd.vol*snd.vol}
function schedule(){if(!snd.started)return;const c=snd.ctx,len=SSRM.sectionLen();
 while(snd.ready.has(snd.next)&&snd.nextT<c.currentTime+40){const d=snd.ready.get(snd.next);snd.ready.delete(snd.next);
  const b=c.createBuffer(2,d.L.length,48000);b.getChannelData(0).set(d.L);b.getChannelData(1).set(d.R);
  const s=c.createBufferSource();s.buffer=b;s.connect(snd.gain);const at=Math.max(snd.nextT,c.currentTime+.05);s.start(at);
  if(!snd.playing){snd.playing=true;snd.firstAt=at;const g=snd.gain.gain;g.setValueAtTime(0,at);g.linearRampToValueAtTime(target(),at+4);sb.textContent='Mute'}
  snd.nextT=at+len;snd.next++}
 for(let k=snd.next;k<snd.next+2;k++)request(k)}
function setGain(){if(!snd.playing)return;const g=snd.gain.gain,now=snd.ctx.currentTime;g.cancelScheduledValues(now);g.setTargetAtTime(target(),now,.12)}
async function soundButton(){
 if(!snd.started){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){sb.textContent='No sound here';return}
  snd.ctx=new AC();snd.gain=snd.ctx.createGain();snd.gain.gain.value=0;snd.gain.connect(snd.ctx.destination);
  try{await snd.ctx.resume()}catch(e){}
  snd.started=true;snd.nextT=snd.ctx.currentTime+.1;if(!snd.playing)sb.textContent='Preparing sound…';
  if(snd.mode==='none'&&!snd.worker)setupRenderer();request(0);request(1);schedule();return}
 if(!snd.playing)return;snd.muted=!snd.muted;sb.textContent=snd.muted?'Unmute':'Mute';setGain()}
sb.onclick=soundButton;
vs.oninput=()=>{snd.vol=vs.value/100;setGain()};
addEventListener('keydown',e=>{if(e.key==='m'||e.key==='M')soundButton()});
setInterval(schedule,1000);
// start rendering the first section in the background so "Start sound" is quick
setTimeout(()=>{setupRenderer();request(0)},1500);
/* ---------- session timer controls ---------- */
const tb=document.getElementById('tmr'),ts=document.getElementById('tmin');
if(Q.get('min')){const m=String(Math.max(1,Math.min(120,+Q.get('min')||20)));if(![...ts.options].some(o=>o.value===m))ts.add(new Option(m,m));ts.value=m}
function chimeCtx(){if(snd.ctx)return snd.ctx;if(!snd.cctx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)snd.cctx=new AC()}return snd.cctx}
// one soft two-note chime (A4 then F5, sine + faint octave, lowpassed); plays even if the music is muted
function chime(){const c=chimeCtx();if(!c)return;if(c.resume)c.resume();const t=c.currentTime+.05,lvl=.16*Math.max(.4,snd.vol);
 [[69,0],[77,.9]].forEach(([m,dt])=>{const f=440*Math.pow(2,(m-69)/12);for(const [mul,a] of [[1,1],[2,.12]]){const o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2500;o.frequency.value=f*mul;
  g.gain.setValueAtTime(0,t+dt);g.gain.linearRampToValueAtTime(lvl*a,t+dt+.03);g.gain.exponentialRampToValueAtTime(.0001,t+dt+3.2);o.connect(lp);lp.connect(g);g.connect(c.destination);o.start(t+dt);o.stop(t+dt+3.3)}})}
function timerButton(){if(tm.on){tm.on=false;tm.done=false;tb.textContent='Start timer';ts.disabled=false;return}
 tm.dur=(+ts.value||20)*60;tm.start=Date.now();tm.on=true;tm.done=false;tb.textContent='Reset timer';ts.disabled=true;const c=chimeCtx();if(c&&c.resume)c.resume()}
tb.onclick=timerButton;addEventListener('keydown',e=>{if(e.key==='t'||e.key==='T')timerButton()});
// a clicked button drops focus, so a later Enter or Space can't press it again (a refocused "Reset timer" would switch the timer off; Bryan, Oct 9)
document.querySelectorAll('#ui button').forEach(b=>b.addEventListener('click',()=>b.blur()));
window.TM=tm;
/* keep the board awake where supported */
let lock=null;async function wake(){try{if('wakeLock' in navigator&&!lock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null})}}catch(e){}}
wake();addEventListener('pointerdown',wake);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});

</script>
