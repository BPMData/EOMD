<script>/* Drawing primitives + typography. Canvas 2D only. */

    for (let i = 0; i < n; i++) { const p = pts[i], q = pts[(i + 1) % n]; ctx.arcTo(p[0], p[1], q[0], q[1], rad); }

  // Variable-width ribbon along a polyline, round caps. pts:[[x,y]], w:[width]

    const n = pts.length; if (n < 2) return;
    const L = [], R = [];
    for (let i = 0; i < n; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
      let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
      const h = w[i] / 2;
      L.push([pts[i][0] - dy * h, pts[i][1] + dx * h]); R.push([pts[i][0] + dy * h, pts[i][1] - dx * h]);
    }
    ctx.beginPath();
    ctx.moveTo(L[0][0], L[0][1]);

      T.set(ctx, 'text', fs); ctx.fillText(p.name, cx + 92 + (1 - grow) * -40, cy + fs * 0.36);
      ctx.restore();
      const bs = E.spring(inv(t0 + 0.15, t0 + 0.7, tau));
      D.hexPath(ctx, cx + chipH / 2, cy, 31 * bs); ctx.fillStyle = a.color; ctx.fill();

  A.footer = (ctx, env, a, idx, fg, tau) => {
    const c = cfg(); const { W, H } = env; const V = H > W;
    const n = c.academies.length;
    const fv = DHS.tw(tau, 0.15, 0.7, E.outCubic);
    ctx.save();
    T.set(ctx, 'text', 30); ctx.fillStyle = fg;
    const y = V ? H - 60 : 1034;

      ctx.textAlign = 'center'; ctx.fillText(c.copy.footerLeft, W / 2, y - 48); ctx.fillText(c.copy.footerRight, W / 2, y);

      ctx.textAlign = 'left'; ctx.fillText(c.copy.footerLeft, 110, y);
      ctx.textAlign = 'right'; ctx.fillText(c.copy.footerRight, W - 110, y);

      else { D.circle(ctx, x, dy, 5.5); ctx.fillStyle = C.rgba(fg, 0.5); ctx.fill(); }

  };

<script>/* EXPLORATION ACADEMY (7.5 s, 3 bars). Teal floods out from the hub:
   every 9th grader starts here. A: starts here. B: 7 academies / 21 pathways
   sprout. C: the diagram folds into a personal ranking list whose items get
   thoughtfully reordered — "Explore. Rank carefully." */
(function (G) {
  'use strict';
  const DHS = (G.DHS = G.DHS || {});
  const { clamp, inv, lerp, TAU } = DHS.math;
  const E = DHS.ease, T = DHS.type, D = DHS.draw, C = DHS.color, S = DHS.common, Hb = DHS.hub;
  const cfg = () => DHS.config;
  const X = (DHS.explorationScene = {});
  const IRIS = 0.72;

  X.scene = (start, dur) => ({
    name: 'exploration', start, dur, tail: 0.66, layer: 1, transIn: IRIS,
    clip(ctx, tau, env) { const g = Hb.geom(env.W, env.H); const p = DHS.tw(tau, 0, IRIS, E.bezier(0.5, 0, 0.2, 1)); D.circle(ctx, g.cx, g.cy, p * Math.hypot(env.W, env.H)); },
    ring(ctx, tau, env) {
      const g = Hb.geom(env.W, env.H); const p = DHS.tw(tau, 0, IRIS, E.bezier(0.5, 0, 0.2, 1)); if (p <= 0 || p >= 1) return;
      ctx.save(); ctx.globalAlpha = 0.9 * (1 - p); ctx.lineWidth = 8; ctx.strokeStyle = '#fff'; D.circle(ctx, g.cx, g.cy, p * Math.hypot(env.W, env.H) + 12); ctx.stroke(); ctx.restore();
    },
    draw(ctx, tau, env) { X.draw(ctx, tau, env, dur); },
    cues(add) {
      add(-0.12, 'swell', { dur: 0.9 });
      add(0.6, 'thump', { gain: 0.7 });
      for (let i = 0; i < 7; i++) for (let j = 0; j < 3; j++) add(2.6 + i * 0.22 + j * 0.108, 'pop', { note: (i + j * 2) % 7, gain: 0.32 });
      add(4.85, 'whoosh', { dur: 0.6, pan: 0 });
      add(5.95, 'slide', {}); add(6.55, 'slide', {});
      add(7.08, 'tick', { gain: 0.6, pitch: 2 });
    },
  });

  X.draw = (ctx, tau, env, dur) => {
    const c = cfg(); const { W, H } = env; const g = Hb.geom(W, H); const col = Hb.col(W, H);
    const teal = c.exploration.color, ink = C.textOn(teal); // audited: ink on teal ≈ 5.1:1 (white is only ≈3.3:1)
    const out = E.inCubic(inv(dur, dur + 0.66, tau));
    ctx.save();
    if (out > 0) { const s = 1 + 0.07 * out; ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2); }

    ctx.save(); ctx.strokeStyle = C.rgba(ink, 0.08); ctx.lineWidth = 3;
    for (let k = 0; k < 8; k++) {

      for (let i = 0; i <= 90; i++) { const a = (i / 90) * TAU; const r = r0 + DHS.noise1(i / 9 + k * 3.7, 5) * 26; const x = g.cx + r * Math.cos(a), y = g.cy + r * Math.sin(a) * 0.92; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.globalAlpha = clamp(1 - (r0 - 420) / 1200); ctx.stroke();
    }
    ctx.restore();

    // ---- diagram (continues seamlessly from the hub scene's unwind)
    const n = c.academies.length;
    const fold = E.inOutCubic(inv(4.8, 5.5, tau));
    if (fold < 1) {
      const st = { rot: Hb.rotAt(17.5) + 0.045 * tau, u: 1, grow: 1, hub: 1, disk: 1, circ: [], hex: [] };
      for (let i = 0; i < n; i++) { st.circ[i] = 1; st.hex[i] = inv(2.6 + i * 0.22, 3.2 + i * 0.22, tau); }
      ctx.save(); const s = 1 - fold; ctx.translate(g.cx, g.cy); ctx.scale(s, s); ctx.rotate(fold * -0.8); ctx.translate(-g.cx, -g.cy);
      Hb.draw(ctx, g, st); ctx.restore();
    }
    // ---- ranking list (C)
    X.ranking(ctx, g, tau, ink, teal);

    // ---- copy
    const e = c.copy.exploration;
    const base = { x: col.x, y: col.V ? col.y : col.y, maxW: col.w, color: ink, anchor: col.V ? 'top' : 'center', leadSize: 42 };
    S.stack(ctx, { ...base, lead: e.a.lead, lines: e.a.lines, maxSize: 150, tIn: 0.55, tOut: 2.3 }, tau);
    { const mA = S.stackMetrics(ctx, { ...base, lead: e.a.lead, lines: e.a.lines, maxSize: 150 }), top = col.V ? col.y : col.y - mA.total / 2;
      const v = S.vis(tau, 0.45, 2.3), cs = DHS.heroCfg.explore[col.V ? 1 : 0];
      if (v.on) { ctx.save(); ctx.globalAlpha = 1 - v.pout; ctx.translate(0, -40 * v.pout);
        DHS.heroes.draw(ctx, 'compass', col.x + 1.05 * cs, top - 28 - 0.64 * cs, cs, ink, teal, (tau - 0.45) * 1.5, DHS.heroCfg.lw); ctx.restore(); } }
    S.stack(ctx, { ...base, lead: e.b.lead, lines: e.b.lines, maxSize: 124, tIn: 2.55, tOut: 4.72 }, tau);
    S.stack(ctx, { ...base, lines: e.c.lines, maxSize: 132, sub: e.c.sub, subSize: 38, tIn: 5.0 }, tau);
    ctx.restore();
  };

  // A personal ranking list. Rows (numbered) stay put; the choices inside get reordered.
  X.ranking = (ctx, g, tau, ink, teal) => {
    const c = cfg();
    const appear = inv(5.1, 5.75, tau); if (appear <= 0) return;
    const rows = 3, rh = 104, rw = g.V ? 640 : 600, gap = 22;
    const x0 = g.cx - rw / 2, y0 = g.cy - ((rows * rh + (rows - 1) * gap) / 2) + 34;
    // label
    const lv = S.vis(tau, 5.15, null);
    if (lv.on) T.line(ctx, c.copy.exploration.rankLabel, x0 + 6, y0 - 34, 40, lv.pin, { role: 'text', color: ink });
    // item positions after swaps: [0,1,2] → [1,0,2] → [1,2,0]
    const s1 = E.inOutCubic(inv(5.95, 6.45, tau)), s2 = E.inOutCubic(inv(6.55, 7.05, tau));
    const slotOf = (item) => {
      const p1 = [1, 0, 2][item], p0 = item; let pos = lerp(p0, p1, s1);
      const p2 = [2, 0, 1][item]; if (s2 > 0) pos = lerp(p1, p2, s2);

    };

    for (let r = 0; r < rows; r++) {
      const q = E.spring(inv(5.12 + r * 0.1, 5.75 + r * 0.1, tau)); if (q <= 0) continue;
      const y = y0 + r * (rh + gap);
      ctx.save(); ctx.translate(x0 + rw / 2, y + rh / 2); ctx.scale(q, q); ctx.translate(-(x0 + rw / 2), -(y + rh / 2));
      D.pill(ctx, x0, y, rw, rh); ctx.fillStyle = C.rgba('#ffffff', 0.34); ctx.fill();
      D.circle(ctx, x0 + rh / 2, y + rh / 2, rh / 2 - 12); ctx.fillStyle = ink; ctx.fill();
      T.set(ctx, 'display', 46); ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.fillText(String(r + 1), x0 + rh / 2, y + rh / 2 + 16);
      ctx.restore();
    }
    const icons = ['bulb', 'leafHouse', 'headphones'], bars = [[250, 150], [300, 110], [210, 170]];
    for (let item = 0; item < 3; item++) {
      const q = E.spring(inv(5.35 + item * 0.1, 5.95 + item * 0.1, tau)); if (q <= 0) continue;
      const pos = slotOf(item), y = y0 + pos * (rh + gap), dx = arcOf(item);
      const x = x0 + rh + 8 + dx;
      ctx.save(); ctx.globalAlpha = clamp(q);
      D.pill(ctx, x, y + 10, rw - rh - 18, rh - 20); ctx.fillStyle = '#ffffff'; ctx.fill();
      D.hexPath(ctx, x + 44, y + rh / 2, 30 * q); ctx.fillStyle = teal; ctx.fill();
      DHS.icons.draw(ctx, icons[item], x + 44, y + rh / 2, 16 * q, ink, 1, tau, 0.11);
      ctx.fillStyle = C.rgba(ink, 0.22);
      D.pill(ctx, x + 90, y + rh / 2 - 17, bars[item][0] * q, 14); ctx.fill();
      D.pill(ctx, x + 90, y + rh / 2 + 5, bars[item][1] * q, 14); ctx.fill();
      ctx.restore();
    }
    // settled: a check draws on beside the label
    const ck = E.outCubic(inv(7.05, 7.4, tau));
    if (ck > 0) { ctx.save(); ctx.strokeStyle = ink; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; D.strokePartial(ctx, [[x0 + rw - 60, y0 - 50], [x0 + rw - 44, y0 - 34], [x0 + rw - 14, y0 - 66]], ck); ctx.restore(); }
  };
})(globalThis);
</script>
<script>/* Film assembly. Everything is derived from config: bar grid → scene times →
   audio cues. render(ctx, t) is a pure function of t (seekable, reproducible). */
(function (G) {
  'use strict';
  const DHS = (G.DHS = G.DHS || {});
  const F = (DHS.film = {});

  F.build = () => {
    const c = DHS.config;
    const bar = (60 / c.film.bpm) * c.film.beatsPerBar;
    const L = bar * c.film.bars;
    const tl = new DHS.Timeline(L);
    const sec = c.sections;
    const add = (scene) => { tl.add(scene); scene.cues && scene.cues((tau, type, p) => tl.cue(scene.start + tau, type, p)); };
    add(DHS.hub.scene(sec.hub.startBar * bar));
    add(DHS.explorationScene.scene(sec.exploration.startBar * bar, sec.exploration.bars * bar));
    c.academies.forEach((a, i) => {
      const start = (sec.academies.startBar + i * sec.academies.barsEach) * bar;
      add(DHS.academyScene.scene(a, i, start, sec.academies.barsEach * bar));
    });
    tl.cues.sort((a, b) => a.t - b.t);
    F.tl = tl; F.length = L; F.bar = bar; F.beat = bar / c.film.beatsPerBar;
    return tl;
  };

  // Section map (for dev UI + audio arrangement)
  F.sections = () => {
    const c = DHS.config, bar = F.bar, s = c.sections;
    const out = [{ id: 'hub-title', label: 'Title (spiral)', t0: 0, t1: 2 * bar }, { id: 'exploration', label: 'Exploration Academy', t0: s.exploration.startBar * bar, t1: (s.exploration.startBar + s.exploration.bars) * bar }];
    c.academies.forEach((a, i) => out.push({ id: a.id, label: a.name, t0: (s.academies.startBar + i * 2) * bar, t1: (s.academies.startBar + i * 2 + 2) * bar }));
    out.push({ id: 'end', label: 'End card', t0: s.hub.startBar * bar, t1: (s.hub.startBar + 3) * bar }, { id: 'rewind', label: 'Rewind → title', t0: (s.hub.startBar + 3) * bar, t1: F.length });
    return out;
  };

  // W,H = design size (1920×1080 or 1080×1920); scale = device pixels per design pixel
  F.render = (ctx, t, W, H, scale = 1) => {
    if (!F.tl) F.build();
    t = DHS.math.mod(t, F.length);
    const env = { W, H, t };
    ctx.save();
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = DHS.config.colors.danburyBlue; ctx.fillRect(0, 0, W, H);
    for (const { s, tau } of F.tl.active(t)) {
      if (s.transIn && tau < s.transIn && s.clip) {
        ctx.save(); s.clip(ctx, tau, env); ctx.clip(); s.draw(ctx, tau, env); ctx.restore();
        if (s.ring) s.ring(ctx, tau, env);
      } else {
        ctx.save(); s.draw(ctx, tau, env); ctx.restore();
      }
    }
    ctx.restore();
  };
})(globalThis);
</script>
<script>/* PLAYER RUNTIME — shared by dev.html and the kiosk player.
   Visual time is a pure function of a clock; the clock is the AudioContext once
   the synthesized loop is playing (sample-accurate A/V lock, seamless loop via
   AudioBufferSourceNode.loop), and performance.now() before that / when muted.
   Audio is synthesized in the browser with the same DSP code as the offline
   export (in a Web Worker when the sources are embedded, else on the main thread). */
(function (G) {
  'use strict';
  const DHS = (G.DHS = G.DHS || {});
  const R = (DHS.runtime = {});

  R.create = (canvas, opts = {}) => {
    const ctx = canvas.getContext('2d', { alpha: false });
    const st = { playing: true, muted: !!opts.muted, orient: opts.orientation || 'auto', maxScale: opts.maxScale || 1,
      base: 0, t0: performance.now() / 1000, audio: null, src: null, aBase: 0, aT0: 0, status: '', listeners: [] };
    const L = () => DHS.film.length;
    const emit = (s) => { st.status = s; st.listeners.forEach((f) => f(s)); };

    // ---- clock
    const clockNow = () => {
      if (st.src && st.audio && st.audio.state === 'running') return st.aBase + (st.audio.currentTime - st.aT0) - (st.audio.outputLatency || st.audio.baseLatency || 0);
      return st.playing ? st.base + (performance.now() / 1000 - st.t0) : st.base;
    };
    const time = () => DHS.math.mod(clockNow(), L());

    // ---- layout: design size by orientation, fit into the window (letterboxed)
    const design = () => { const o = st.orient === 'auto' ? (innerWidth >= innerHeight ? 'landscape' : 'vertical') : st.orient; return o === 'vertical' ? [1080, 1920] : [1920, 1080]; };
    let dims = [0, 0, 1];
    const fit = () => {
      const [W, H] = design(), dpr = devicePixelRatio || 1;
      const s = Math.min((innerWidth * dpr) / W, (innerHeight * dpr) / H, st.maxScale);
      const cw = Math.round(W * s), ch = Math.round(H * s);
      if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
      dims = [W, H, s];
    };
    addEventListener('resize', fit); fit();

    // ---- render loop (rAF only schedules; the frame content depends on time only)
    let raf = 0, frames = 0, fpsT = performance.now(), fps = 0, last = 0; const cap = opts.fps || 30;
    const frame = (now) => {
      raf = requestAnimationFrame(frame);
      if (now && now - last < 1000 / cap - 3) return; last = now || 0; // 30 fps cap (even cadence on 60 Hz screens)
      DHS.film.render(ctx, time(), dims[0], dims[1], dims[2]);
      frames++; const n = performance.now(); if (n - fpsT > 1000) { fps = (frames * 1000) / (n - fpsT); frames = 0; fpsT = n; }
    };

    // ---- audio
    const synth = () => new Promise((resolve, reject) => {
      const cues = (DHS.film.tl || DHS.film.build()).cues;
      const srcEl = document.getElementById('dhs-audio-src');
      if (srcEl && G.Worker && G.Blob) {
        const code = srcEl.textContent + '\nself.onmessage=(e)=>{const r=DHS.audio.render({cues:e.data.cues});self.postMessage({L:r.master.L,R:r.master.R,sr:r.sr},[r.master.L.buffer,r.master.R.buffer]);};';
        const w = new Worker(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
        w.onmessage = (e) => { resolve(e.data); w.terminate(); }; w.onerror = (e) => reject(e);
        w.postMessage({ cues });
      } else setTimeout(() => { try { const r = DHS.audio.render({ cues }); resolve({ L: r.master.L, R: r.master.R, sr: r.sr }); } catch (e) { reject(e); } }, 30);
    });
    let buffer = null, synthP = null;
    const startSource = () => {
      if (!buffer || !st.audio || st.muted || !st.playing) return;
      stopSource();
      const t = time(), src = st.audio.createBufferSource(), g = st.audio.createGain();
      src.buffer = buffer; src.loop = true; src.connect(g).connect(st.audio.destination);
      g.gain.setValueAtTime(0, st.audio.currentTime); g.gain.linearRampToValueAtTime(1, st.audio.currentTime + 0.25); // no click on start
      const when = st.audio.currentTime + 0.05;
      src.start(when, DHS.math.mod(t + 0.05, L()));
      st.src = src; st.gain = g; st.aT0 = when; st.aBase = t + 0.05 + (st.audio.outputLatency || st.audio.baseLatency || 0);
    };
    const stopSource = () => { if (st.src) { try { st.src.stop(); } catch (e) {} st.src.disconnect(); st.src = null; } };
    const freezeClock = () => { st.base = clockNow(); st.t0 = performance.now() / 1000; };

    const api = {
      ctx, st, time, fit, get fps() { return fps; }, get audioReady() { return !!buffer; },
      get audioRunning() { return !!(st.audio && st.audio.state === 'running' && st.src); },
      onStatus(f) { st.listeners.push(f); },
      start() { if (!raf) frame(); },
      async enableAudio() { // safe to call repeatedly (e.g. on every user gesture)
        if (st.muted) return;
        if (!st.audio) { const AC = G.AudioContext || G.webkitAudioContext; if (!AC) return emit('no-audio'); st.audio = new AC({ latencyHint: 'playback' }); }
        if (!synthP) { emit('synth'); synthP = synth().then((d) => { buffer = st.audio.createBuffer(2, d.L.length, d.sr); buffer.copyToChannel(d.L, 0); buffer.copyToChannel(d.R, 1); emit('ready'); }).catch((e) => { console.error(e); emit('audio-error'); }); }
        try { await st.audio.resume(); } catch (e) {}
        await synthP;
        if (st.audio.state !== 'running') return emit('blocked');
        if (!st.src) { freezeClock(); startSource(); }
        emit(st.src ? 'playing' : st.status);
      },
      play() { if (st.playing) return; st.t0 = performance.now() / 1000; st.playing = true; startSource(); },
      pause() { if (!st.playing) return; freezeClock(); st.playing = false; stopSource(); },
      toggle() { st.playing ? api.pause() : api.play(); },
      seek(t) { st.base = DHS.math.mod(t, L()); st.t0 = performance.now() / 1000; if (st.src) { stopSource(); startSource(); } },
      mute(m = !st.muted) { freezeClock(); st.muted = m; if (m) stopSource(); else api.enableAudio(); },
      orient(o) { st.orient = o; fit(); },
    };
    return api;
  };
})(globalThis);
</script>
