<!doctype html><html><head><meta charset="utf-8"><style>
:root{--paper:#F2EDE3;--ink:#1B1A17;--mute:#6b655b;--rule:#c9c0ae;--indigo:#1E2A57;--steel:#9aa0a6}
*{margin:0;box-sizing:border-box}
body{width:390px;height:844px;background:var(--paper);font-family:'Bitstream Charter',serif;color:var(--ink);overflow:hidden;position:relative}
.top{height:10px;background:var(--indigo)}
.hd{padding:18px 16px 10px;border-bottom:1.5px solid var(--ink);margin:0 16px;padding-left:0;padding-right:0;display:flex;justify-content:space-between;align-items:baseline}
.hd b{font-family:'Inter Display';font-weight:900;font-size:13px;letter-spacing:.22em}
.hd span{font-family:Inter;font-size:11px;color:var(--mute);letter-spacing:.08em}
h3{font-family:'Inter Display';font-weight:900;font-size:30px;line-height:1;margin:14px 16px 6px}
.lede{font-size:16px;line-height:1.45;margin:0 16px 4px;color:#2c2a25}
.ctl{margin:4px 16px 0}
.lab{font-family:Inter;font-size:11px;letter-spacing:.14em;color:var(--mute);display:flex;justify-content:space-between}
.lab b{color:var(--ink);font-size:13px;letter-spacing:.04em}
.tog{display:flex;margin:12px 16px 0;border:1.5px solid var(--ink);width:max-content}
.tog div{font-family:'Inter Display';font-weight:800;font-size:12px;letter-spacing:.14em;padding:8px 14px}
.tog .on{background:var(--ink);color:var(--paper)}
.foot{position:absolute;left:16px;bottom:16px;font-family:Inter;font-size:10px;color:var(--mute);width:250px;line-height:1.4}
.belt{position:absolute;right:12px;bottom:10px}
</style></head><body>
<div class="top"></div>
<div class="hd"><b>PLATE 3</b><span>EDGE ANGLE</span></div>
<h3>Thinner cuts easier. Thinner breaks easier.</h3>
<p class="lede">Drag the angle. The edge on the left is drawn to scale; the bar says how long it keeps cutting.</p>
<svg width="390" height="330" viewBox="0 0 390 330">
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#6d7277" stroke-width="1.2"/></pattern></defs>
<!-- cross-section, edge pointing down; 34° inclusive -->
<g transform="translate(100,20)">
<polygon points="-26,0 26,0 22,190 0,262 -22,190" fill="#c5c9cd" stroke="var(--ink)" stroke-width="1.5"/>
<polygon points="22,190 0,262 -22,190" fill="url(#hatch)" stroke="var(--ink)" stroke-width="1.5"/>
<!-- angle arc -->
<path d="M -9.4,231.4 A 32 32 0 0 0 9.4,231.4" fill="none" stroke="#B3261E" stroke-width="2"/>
<line x1="0" y1="262" x2="-37" y2="141" stroke="#B3261E" stroke-width="1" stroke-dasharray="3 3"/><line x1="0" y1="262" x2="37" y2="141" stroke="#B3261E" stroke-width="1" stroke-dasharray="3 3"/>
<text x="0" y="290" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="20" fill="#B3261E">34°</text>
<text x="0" y="306" text-anchor="middle" font-family="Inter" font-size="10" fill="var(--mute)" letter-spacing="1">INCLUSIVE</text>
<!-- callouts -->
<g font-family="Inter" font-size="11" fill="var(--ink)">
<line x1="26" y1="8" x2="58" y2="8" stroke="var(--ink)"/><circle cx="68" cy="8" r="9" fill="none" stroke="var(--ink)"/><text x="68" y="12" text-anchor="middle">1</text><text x="82" y="12">spine</text>
<line x1="22" y1="200" x2="58" y2="200" stroke="var(--ink)"/><circle cx="68" cy="200" r="9" fill="none" stroke="var(--ink)"/><text x="68" y="204" text-anchor="middle">2</text><text x="82" y="204">bevel</text>
</g></g>
<!-- edge life bars -->
<g transform="translate(210,70)" font-family="Inter" font-size="11">
<text x="0" y="0" font-family="Inter Display" font-weight="800" font-size="11" letter-spacing="1.6" fill="var(--mute)">CARD CUT BEFORE DULL</text>
<g transform="translate(0,22)"><text x="0" y="12" fill="var(--mute)">20°</text><rect x="30" y="2" width="130" height="14" fill="none" stroke="var(--rule)"/><rect x="30" y="2" width="130" height="14" fill="#d8d2c5"/><text x="160" y="34" text-anchor="end" fill="var(--mute)">~800 mm</text></g>
<g transform="translate(0,72)"><text x="0" y="12" font-weight="700" fill="var(--ink)">34°</text><rect x="30" y="2" width="73" height="14" fill="var(--indigo)"/><text x="160" y="34" text-anchor="end" font-weight="700" fill="var(--ink)">~450 mm</text></g>
<g transform="translate(0,122)"><text x="0" y="12" fill="var(--mute)">50°</text><rect x="30" y="2" width="41" height="14" fill="#d8d2c5"/><text x="160" y="34" text-anchor="end" fill="var(--mute)">~250 mm</text></g>
<text x="0" y="196" fill="var(--mute)" font-size="10">German factory edge: 30–40°</text>
<text x="0" y="212" fill="var(--mute)" font-size="10">Japanese factory edge: 24–30°</text>
</g>
</svg>
<div class="ctl">
<div class="lab"><span>ANGLE (INCLUSIVE)</span><b>34°</b></div>
<svg width="358" height="40"><line x1="0" y1="20" x2="358" y2="20" stroke="var(--ink)" stroke-width="2"/>
<g font-family="Inter" font-size="10" fill="var(--mute)"><line x1="0" y1="12" x2="0" y2="28" stroke="var(--ink)"/><text x="0" y="40">20°</text><line x1="358" y1="12" x2="358" y2="28" stroke="var(--ink)"/><text x="335" y="40">50°</text></g>
<rect x="155" y="8" width="24" height="24" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/></svg>
</div>
<div class="tog"><div class="on">DOUBLE BEVEL</div><div>SINGLE BEVEL</div></div>
<div class="foot">CATRA card-cut figures from Knife Steel Nerds (q4), to be checked before launch.</div>
<svg class="belt" width="96" height="60" viewBox="0 0 96 60"><rect x="0" y="16" width="96" height="16" fill="#5a3b1e"/><rect x="24" y="4" width="48" height="40" fill="#D4A63A"/><rect x="28" y="8" width="40" height="32" fill="none" stroke="#7a5a16"/><text x="48" y="22" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="7" fill="#3a2a08">SPLIT</text><text x="48" y="33" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="7" fill="#3a2a08">TITLE</text></svg>
</body></html>
