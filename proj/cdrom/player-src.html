     Built by tools/build_cdrom.py, which fills in the four base64 fonts and the DUD/CARDS/WORDS hooks. -->
<style>

</style></head><body>
<canvas id="cv" role="img" aria-label="CS lab screensaver: failed virtual pets wander a 90s desktop while coding tips appear in English, Spanish and Portuguese"></canvas>
<div id="ui"><button id="snd" type="button">Start sound</button><button id="mus" type="button">Music: Chips</button><label><span>Volume</span><input id="vol" type="range" min="0" max="100" value="70"></label><button id="tmr" type="button">Start timer</button><label><span>Minutes</span><select id="tmin"><option>5</option><option>10</option><option>15</option><option selected>20</option><option>25</option><option>30</option><option value="c">Other…</option></select><input id="tcus" type="number" min="1" max="240" value="20" aria-label="Custom minutes" hidden></label><button id="pv" type="button">Previous Era</button><button id="nx" type="button">Next Era</button><button id="pp" type="button">Pause</button><button id="fs" type="button">Fullscreen</button></div>
<div id="fps" hidden></div>
<script id="audiolib">__AUDIOLIB__</script>
<script>
'use strict';
/*__DUD__*/
/*__CARDS__*/
/*__WORDS__*/
const Q=new URLSearchParams(location.search),W=1920,H=1080,TAU=Math.PI*2,RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const buf=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c};
function rng(s){s=s>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const R=rng(+Q.get('vseed')||(Date.now()%1e9));
const BAY4=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const FACE='#CFC8B8',LT='#F7F2E6',DK='#6F6A5E',DD='#36332D',C={cream:'#F4E8CC',charcoal:'#262626',mustard:'#E3A92B'};
const WPAL=['#ff5fa2','#ffd23f','#3fe0c5','#a98bff','#ff8a3d','#8be04e'];
const ease=p=>1-Math.pow(1-p,3),hit=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
function hx(c){c=c.replace('#','');return[0,2,4].map(i=>parseInt(c.substr(i,2),16))}
function mix(a,b,t){const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function bevel(c,x,y,w,h,inset){c.fillStyle=inset?DK:LT;c.fillRect(x,y,w,4);c.fillRect(x,y,4,h);c.fillStyle=inset?LT:DK;c.fillRect(x,y+h-4,w,4);c.fillRect(x+w-4,y,4,h)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickWords(n,not){return shuffle(CODEWORDS.filter(w=>!not.includes(w))).slice(0,n)}
let T=0;const tm={on:false,start:0,dur:1200,done:false,doneAt:0};
 
/* ================= Duds: shared roster rules ================= */
let DID=0;
function mkDud(tr){return{id:++DID,tr:tr||DUD.random(R),angry:0,bonk:0,cheer:0,life:T+25+R()*35,next:T+.3,state:'roam',x:0,y:0}}
const isSpk=d=>CM.state!=='gap'&&CM.spk===d.id;
function speaking(d,t){if(!isSpk(d)||CM.state!=='show')return false;const e=t-CM.t0;return POP.some((p,k)=>e>=p&&e<p+SPEECH[k])}
function face(d,t){const tr=Object.assign({},d.tr);if(d.angry>t){tr.eyes='angry';tr.mouth='frown'}else if(d.bonk>t){tr.eyes='mismatch';tr.mouth='O'}
 else if(d.cheer>t){tr.eyes='happy';tr.mouth='grin'}else if(speaking(d,t))tr.mouth=Math.floor(t/.2)%2?'O':'flat';return tr}
// exact-pixel sprite cache (ImageData, so no anti-aliased seams), drawn with smoothing off
const SPRC=new Map();
function dudSpr(rows,pal,gog){const k=rows.join('')+pal+(gog?1:0);let b=SPRC.get(k);if(b)return b;if(SPRC.size>300)SPRC.clear();
 b=buf(17,16);const c=b.getContext('2d'),d=c.createImageData(17,16),P=Object.assign({},DUD.INK,DUD.PAL[pal]);
 const put=(x,y,col)=>{if(x<0||y<0||x>16||y>15)return;const [r,g,bl]=hx(col),i=(y*17+x)*4;d.data[i]=r;d.data[i+1]=g;d.data[i+2]=bl;d.data[i+3]=255};
 rows.forEach((row,r)=>{for(let q=0;q<16;q++)if(row[q]!=='.')put(q,r+1,P[row[q]])});
 if(gog)DUD.GOGGLES.forEach((row,r)=>{for(let q=0;q<16;q++)if(row[q]!=='.')put(q+1,r,DUD.GPAL[row[q]])});
 c.putImageData(d,0,0);SPRC.set(k,b);return b}
 
/* ================= cards: shuffled bag, sentence-split pages, three windows ================= */
const PAGE=12.5,POP=[0,1.4,2.4],SPEECH=[1.3,.9,.9];  // EN, ES, PT: each window pops as its speech phrase starts
const segs=s=>s.split('`').map((t,i)=>({t,code:i%2===1})).filter(x=>x.t);
const plain=s=>s.replace(/`/g,'');
const even=s=>s.split('`').length%2===1;
function units(s){const o=[];let cur=[];for(const w of s.split(' ')){cur.push(w);const tk=cur.join(' ');if(/[.!?:]$/.test(w)&&!/^\d+\.$/.test(w)&&even(tk)){o.push(tk);cur=[]}}if(cur.length)o.push(cur.join(' '));return o}
function halve(u){const w=u.split(' ');let best=-1,bd=1e9;for(let i=1;i<w.length;i++){const a=w.slice(0,i).join(' ');if(!even(a))continue;const d=Math.abs(a.length-u.length/2);if(d<bd){bd=d;best=i}}
 return best<0?null:[w.slice(0,best).join(' '),w.slice(best).join(' ')]}
function partition(us,n){us=us.slice();while(us.length<n){let k=0;us.forEach((u,i)=>{if(u.length>us[k].length)k=i});const s=halve(us[k]);if(!s)break;us.splice(k,1,...s)}
 const m=us.length,g=Math.min(n,m),pre=[0];for(const u of us)pre.push(pre[pre.length-1]+u.length+1);
 const f=(i,g)=>{if(g===1)return[pre[m]-pre[i],[m]];let b=[1e9,null];for(let j=i+1;j<=m-g+1;j++){const r=f(j,g-1),c=Math.max(pre[j]-pre[i],r[0]);if(c<b[0])b=[c,[j,...r[1]]]}return b};
 const out=[];let i=0;for(const j of f(0,g)[1]){out.push(us.slice(i,j).join(' '));i=j}while(out.length<n)out.push(out[out.length-1]);return out}
const M=buf(8,8).getContext('2d');
// rich text: `code` spans in Source Code Pro on a soft pill; breaks only at spaces
function richWrap(m,text,mw,fN,fC,pad){const groups=[];let g=[];
 for(const s of segs(text)){if(s.code){g.push({t:s.t,code:1});continue}for(const p of s.t.split(/( +)/)){if(!p)continue;if(/^ +$/.test(p)){if(g.length)groups.push(g);g=[]}else g.push({t:p,code:0})}}
 if(g.length)groups.push(g);for(const G of groups)for(const tk of G){m.font=tk.code?fC:fN;tk.w=m.measureText(tk.t).width+(tk.code?2*pad:0)}
 m.font=fN;const sp=m.measureText(' ').width,lines=[];let cur=[],cw=0;
 for(const G of groups){const gw=G.reduce((a,t)=>a+t.w,0);if(cur.length&&cw+sp+gw>mw){lines.push({g:cur,w:cw,sp});cur=[];cw=0}if(cur.length)cw+=sp;cur.push(G);cw+=gw}
 if(cur.length)lines.push({g:cur,w:cw,sp});return lines}
function drawRich(c,ln,x,y,fN,fC,pad,col,pill,sz){let xx=x;ln.g.forEach((G,gi)=>{if(gi)xx+=ln.sp;for(const tk of G){if(tk.code){c.fillStyle=pill;c.fillRect(xx,y-sz*.82,tk.w,sz*1.08);c.font=fC;c.fillStyle=col;c.fillText(tk.t,xx+pad,y)}else{c.font=fN;c.fillStyle=col;c.fillText(tk.t,xx,y)}xx+=tk.w}})}
/* pixel windows (Contour Desk): EN cream/charcoal, ES charcoal + mustard title, PT mustard/charcoal */
const BV=6,TBH=56,PADX=40,PTOP=12,HL=100,BL=62,PB=18,MAXW=1560,HS=112,BODYF='52px Atk',CODEF='600 46px Mono';
const PSTY=[{lab:'English',bg:C.cream,tc:C.charcoal,bc:C.charcoal,pill:'rgba(38,38,38,.10)'},{lab:'Español',bg:C.charcoal,tc:C.mustard,bc:C.cream,pill:'rgba(244,232,204,.16)'},{lab:'Português',bg:C.mustard,tc:C.charcoal,bc:C.charcoal,pill:'rgba(38,38,38,.12)'}];
const PX=[60,200,130],PY=[16,356,696];
const hlF=hs=>[`${hs}px VT`,`700 ${Math.round(hs*.72)}px Mono`];
function pixFit(k,ti,bo,force){let hs=HS,tl=richWrap(M,ti,1e5,...hlF(hs),10)[0];
 if(tl.w>MAXW){hs=Math.max(90,Math.floor(hs*MAXW/tl.w));tl=richWrap(M,ti,1e5,...hlF(hs),10)[0];if(tl.w>MAXW&&!force)return null}
 const lines=richWrap(M,bo,MAXW,BODYF,CODEF,9);if(lines.length>2&&!force)return null;
 const cw=Math.max(tl.w,...lines.map(l=>l.w),520);return{hs,tl,lines,w:Math.ceil(cw)+2*PADX+2*BV,h:BV+TBH+PTOP+HL+lines.length*BL+PB+BV}}
function titleBar(c,x,y,w,h){const A=[15,76,92],B2=[62,156,143],cell=4;for(let yy=0;yy<h;yy+=cell)for(let xx=0;xx<w;xx+=cell){const lvl=xx/w*4,lo=Math.floor(lvl),th=(BAY4[((yy/cell)&3)*4+((xx/cell)&3)]+.5)/16,k=Math.min(4,lo+(lvl-lo>th?1:0))/4;
 c.fillStyle=`rgb(${A.map((a,i)=>Math.round(a+(B2[i]-a)*k))})`;c.fillRect(x+xx,y+yy,Math.min(cell,w-xx),Math.min(cell,h-yy))}}
function chrome(c,w,h,lab){c.fillStyle=FACE;c.fillRect(0,0,w,h);bevel(c,0,0,w,h,0);titleBar(c,BV,BV,w-2*BV,TBH);c.textBaseline='alphabetic';
 if(lab){c.font='52px VT';c.fillStyle='#0E2A30';c.fillText(lab,26,BV+TBH/2+17);c.fillStyle='#fff';c.fillText(lab,24,BV+TBH/2+15)}
 for(const i of[0,1]){const bx=w-BV-52-i*54,by=BV+6;c.fillStyle=FACE;c.fillRect(bx,by,44,44);bevel(c,bx,by,44,44,0);c.fillStyle=DD;if(i===0)c.fillRect(bx+12,by+28,20,6);else{c.strokeStyle=DD;c.lineWidth=4;c.strokeRect(bx+12,by+12,20,18)}}}
function renderPixWin(k,L,pg){const S=PSTY[k],b=buf(L.w,L.h),c=b.getContext('2d');chrome(c,L.w,L.h,S.lab+pg);
 c.fillStyle=S.bg;c.fillRect(BV,BV+TBH,L.w-2*BV,L.h-2*BV-TBH);const x=BV+PADX,[fN,fC]=hlF(L.hs);
 drawRich(c,L.tl,x,BV+TBH+PTOP+Math.round(L.hs*.86),fN,fC,10,S.tc,S.pill,L.hs);
 L.lines.forEach((ln,i)=>drawRich(c,ln,x,BV+TBH+PTOP+HL+Math.round(BL*.76)+i*BL,BODYF,CODEF,9,S.bc,S.pill,52));return b}
/* text-mode windows (D1/D2): 16-color palette, double-line borders, inverse label chip, black shadow */
const COLS=72,ROWS=24,CW=26.4,GH=45,X0=(W-COLS*CW)/2;
const TSTY=[{lab:'English',bg:'#aaaaaa',bd:'#ffffff',lf:'#000000',tc:'#0000aa',bc:'#000000',x:1,y:0},
 {lab:'Español',bg:'#aa00aa',bd:'#ffff55',lf:'#000000',tc:'#ffff55',bc:'#ffffff',x:4,y:8},
 {lab:'Português',bg:'#00aaaa',bd:'#ffffff',lf:'#000000',tc:'#000000',bc:'#000000',x:2,y:16}];
function wrapMono(s,mw){const o=[];let cur='';for(const w of s.split(' ')){const n=cur?cur+' '+w:w;if(n.length<=mw||!cur)cur=n;else{o.push(cur);cur=w}}return o.concat(cur)}
function txtFit(k,ti,bo,force){const S=TSTY[k],bw=COLS-2-S.x-6,tl=plain(ti),lines=wrapMono(plain(bo),bw);
 if(!force&&(2*tl.length>bw||lines.length>3||lines.some(l=>l.length>bw)))return null;
 return{w:Math.min(COLS-2-S.x,Math.max(2*tl.length,...lines.map(l=>l.length),14)+6),h:4+Math.min(3,lines.length),title:tl,lines:lines.slice(0,3)}}
const LAYC={};
function cardLayout(card){if(LAYC[card.id])return LAYC[card.id];const L3=[card.en,card.es,card.pt];let res;
 for(let n=1;n<=5&&!res;n++){const pix=[],txt=[];let ok=true;
  L3.forEach(([ti,bo],k)=>{const pages=partition(units(bo),n);pix[k]=pages.map(p=>pixFit(k,ti,p)||(ok=false,pixFit(k,ti,p,1)));txt[k]=pages.map(p=>txtFit(k,ti,p)||(ok=false,txtFit(k,ti,p,1)))});
  if(ok||n===5)res={n,pix,txt}}
 return LAYC[card.id]=res}
const OFF=(Q.get('off')||'').split(',').filter(Boolean),ACTIVE=CARDS.filter(c=>(!c.py||Q.has('python'))&&!OFF.includes(c.id));
const CM={state:'gap',next:8,card:null,lay:null,spk:null,t0:0,cT:0,said:0,bag:[],last:null};
const WINC=new Map();
function nextCard(){if(!CM.bag.length){CM.bag=shuffle(ACTIVE.slice());if(CM.bag.length>1&&CM.bag[CM.bag.length-1]===CM.last)CM.bag.unshift(CM.bag.pop())}return CM.last=CM.bag.pop()}
function stepCards(){const t=T,sim=CUR.sim,done=tm.on&&tm.done;
 if(done&&CM.state==='call'){if(CM.pl)MUS.cardCancel(CM.pl);CM.pl=null;CM.state='gap';CM.next=t+8}
 if(done&&CM.state==='show'){CM.state='close';CM.cT=t}
 if(CM.state==='gap'){if(t>=CM.next&&!done&&ACTIVE.length&&!(sim.busy&&sim.busy())&&MUS.cardOK()){  // D2 holds the next card while the party changes rooms
 CM.card=nextCard();CM.lay=cardLayout(CM.card);WINC.clear();CM.state='call';CM.cT=t;CM.spk=null;CM.pl=MUS.prepCard()}}
 else if(CM.state==='call'){let d=CM.spk!=null&&sim.find(CM.spk);if(!d){CM.spk=null;d=sim.pickSpeaker();if(d)CM.spk=d.id;else if(!sim.duds.length)sim.spawn()}
  if((d&&d.state==='roam'&&!d.hop&&t-CM.cT>=.7)||t-CM.cT>(CM.pl?16:8)){if(CM.pl){const g=MUS.cardGo(CM.pl);if(!g)return;if(g.stale){CM.pl=MUS.prepCard();return}CM.pl=null}CM.state='show';CM.t0=t;CM.said=0}}
 else if(CM.state==='show'){const e=t-CM.t0;while(CM.said<3&&e>=POP[CM.said]){speakCard(CM.said);CM.said++}if(e>=POP[2]+CM.lay.n*PAGE){CM.state='close';CM.cT=t}}
 else if(CM.state==='close'&&t-CM.cT>=.3){CM.state='gap';CM.next=t+15+R()*10;CM.spk=null;CM.card=null}}
function winState(k){if(!CM.card||(CM.state!=='show'&&CM.state!=='close'))return null;const e=(CM.state==='show'?T:CM.cT)-CM.t0;if(e<POP[k])return null;
 const page=Math.min(CM.lay.n-1,Math.floor(Math.max(0,e-POP[2])/PAGE));return{page,p:CM.state==='show'?Math.min(1,(e-POP[k])/.35):Math.max(0,1-(T-CM.cT)/.3)}}
const pgLab=pg=>CM.lay.n>1?`  ${pg+1}/${CM.lay.n}`:'';
function deskCards(c,sim){for(let k=0;k<3;k++){const st=winState(k);if(!st)continue;const key=CM.card.id+'|'+k+'|'+st.page;let im=WINC.get(key);
 if(!im){im=renderPixWin(k,CM.lay.pix[k][st.page],pgLab(st.page));WINC.set(key,im)}
 const w=im.width,h=im.height,x=Math.min(PX[k],W-20-w),y=PY[k];
 if(st.p<1){const e=ease(st.p);if(RM){c.globalAlpha=st.p;c.drawImage(im,x,y);c.globalAlpha=1;continue}
  const s=sim.spkRect()||{x:W/2-64,y:H/2-60,w:128,h:120},L=f=>[s.x+(x-s.x)*f,s.y+(y-s.y)*f,s.w+(w-s.w)*f,s.h+(h-s.h)*f];
  c.strokeStyle='#fff';c.lineWidth=3;c.globalAlpha=.6;for(let q=1;q<=3;q++)c.strokeRect(...L(Math.max(0,e-q*.18)));
  c.globalAlpha=Math.min(1,st.p*2.2);c.drawImage(im,...L(e));c.globalAlpha=1;continue}
 c.fillStyle='rgba(0,0,0,.4)';c.fillRect(x+12,y+12,w,h);c.drawImage(im,x,y)}}
function gridCards(G,sim){for(let k=0;k<3;k++){const st=winState(k);if(!st)continue;const L=CM.lay.txt[k][st.page],S=TSTY[k];
 if(st.p<1){const e=RM?1:ease(st.p),s=sim.spkRect()||{x:30,y:10,w:10,h:4};
  frame(G,Math.round(s.x+(S.x-s.x)*e),Math.round(s.y+(S.y-s.y)*e),Math.max(3,Math.round(s.w+(L.w-s.w)*e)),Math.max(3,Math.round(s.h+(L.h-s.h)*e)),S.bg,S.bd);continue}
 frame(G,S.x,S.y,L.w,L.h,S.bg,S.bd);G.text(S.x+3,S.y,' '+S.lab+pgLab(st.page)+' ',S.lf,S.bd);G.big.push({x:S.x+3,y:S.y+1,s:L.title,fg:S.tc});L.lines.forEach((l,j)=>G.text(S.x+3,S.y+3+j,l,S.bc))}}
/* end of timer: approved CS end card copy */
const SAVE=['SAVE YOUR WORK!','¡Guarda tu trabajo!','Salve seu trabalho!'];
let SAVEIMG=null;
function deskSave(c){if(!(tm.on&&tm.done))return;if(!SAVEIMG){const m=M;m.font='132px VT';const w=Math.ceil(m.measureText(SAVE[0]).width)+2*PADX+2*BV+40,h=BV+TBH+40+130+2*72+40+BV,b=buf(w,h),c=b.getContext('2d');

 if(e>=tp){const k=cl((e-tp)/.45),q=k-1,ob=1+2.70158*q*q*q+1.70158*q*q,s2=RM?1:2.4-1.4*ob,P=I.pu,w=P.width*s2,h=P.height*s2;   // punch line zooms in with a bounce
  c.globalAlpha=cl(k*3);c.drawImage(P,W/2-w/2,770-h/2,w,h);c.globalAlpha=1}
 const tq=tp+.9;if(e>=tq){if(RM||(e-tq)%1<.7){c.font='64px VT';c.fillStyle='#ffff55';c.fillText('CLICK OR PRESS ANY KEY TO BEGIN',W/2,982)}
  c.font='46px VT';c.fillStyle='#9a9ab0';c.fillText('press M to begin without sound',W/2,1036)}
 c.textAlign='left';c.imageSmoothingEnabled=sm}
function bootLoading(){if(!BOOT.on)return;const s=cv.width/W;ctx.setTransform(s,0,0,s,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.font='56px VT';ctx.fillStyle='#aaaaaa';ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText('LOADING... PLEASE WAIT',80,1000)}
function drawBoot(now){if(BOOT.t0<0)BOOT.t0=now;const e=now-BOOT.t0;BOOT.frz=e;if(e>BOOT_AUTO){bootGo(false);return}const s=cv.width/W;ctx.setTransform(s,0,0,s,0,0);ctx.imageSmoothingEnabled=true;
 try{bootFrame(ctx,e)}catch(err){console.error('boot screen',err);BOOT.on=false;document.body.classList.remove('boot');return}ctx.drawImage(SCAN,0,0,W,H)}
// the boot card dissolves into Tomb of the Duds! (drawn over the first second of the channel)
function bootOver(c){if(!BOOT.on||BOOT.out<0)return;const e=performance.now()/1000-BOOT.out;if(e>=BOOT_OUT){BOOT.on=false;BOOT.img=BOOT.ob=null;return}
 try{const B=BOOT.ob||(BOOT.ob=buf(W,H)),bc=B.getContext('2d');bc.setTransform(1,0,0,1,0,0);bc.globalCompositeOperation='source-over';bc.imageSmoothingEnabled=true;bootFrame(bc,BOOT.frz);
  bc.globalCompositeOperation='destination-in';bc.imageSmoothingEnabled=false;bc.drawImage(ditherMask(1-e/BOOT_OUT),0,0,W,H);bc.globalCompositeOperation='source-over';c.drawImage(B,0,0,W,H)}catch(err){BOOT.on=false}}
function bootChime(){if(!BOOT_CHIME||!snd.ctx||snd.muted)return;const x=snd.ctx,t=x.currentTime+.05,out=x.createGain(),lp=x.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5000;out.gain.value=snd.vol*snd.vol*BOOT_CHIME;lp.connect(out);out.connect(x.destination);
 [72,76,79,84].forEach((m,i)=>{const at=t+i*.09,len=2.2-i*.09;for(const [mul,typ,a] of [[1,'triangle',.16],[2,'sine',.05],[1.003,'sawtooth',.02]]){const o=x.createOscillator(),g=x.createGain();o.type=typ;o.frequency.value=mf(m)*mul;
  g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(a,at+.01);g.gain.exponentialRampToValueAtTime(.0005,at+len);o.connect(g);g.connect(lp);o.start(at);o.stop(at+len+.05)}})}   // "ta-daa": C major arpeggio up to C6
function bootGo(sound){if(!BOOT.on||BOOT.out>=0||!CUR)return;if(sound&&!snd.started){soundButton();bootChime()}BOOT.out=performance.now()/1000;document.body.classList.remove('boot')}
addEventListener('keydown',e=>{if(!BOOT.on||BOOT.out>=0)return;const k=e.key.toLowerCase();
 if(e.metaKey||e.ctrlKey||e.altKey||['shift','control','alt','meta','tab','escape','f','capslock'].includes(k)||/^f\d+$/.test(k))return;e.preventDefault();e.stopImmediatePropagation();bootGo(k!=='m')},true);
addEventListener('click',()=>{if(BOOT.on&&BOOT.out<0)bootGo(true)},true);

/*__ADDONS__*/
/* ================= channel surf: ~4-5 min each, ordered-dither dissolve; cards + Duds persist ================= */
const ORDER=['ascii','dos','stars','desk','maze'],LOCK=ORDER.includes(Q.get('ch'))?Q.get('ch'):null,SURF=+Q.get('surf')||0,DIS=2;
const make=k=>k==='desk'?new Desk():k==='maze'?new Maze():k==='stars'?new Stars():k==='ascii'?new Dungeon():new GSim(k);
let CUR,NXT=null,disT0=0,chEnd=0;
const hold=()=>SURF||240+R()*60;
let WAIT=null;
function startSwitch(key,dir){if(NXT||WAIT)return;dir=dir<0?-1:1;key=key||ORDER[(ORDER.indexOf(CUR.key)+dir+ORDER.length)%ORDER.length];MUS.dir(dir);MUS.want(key);WAIT={key,at:-1};(dir<0?pv:nx).textContent='Switching…'}
function beginSwitch(key){NXT={key,sim:make(key)};NXT.sim.adopt(CUR.sim);disT0=T;nx.textContent='Next Era';pv.textContent='Previous Era'}
const MW=160,MH=90,mC=buf(MW,MH),mX=mC.getContext('2d'),mD=mX.createImageData(MW,MH);
function ditherMask(p){const d=mD.data;for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const v=.55*(BAY4[(y&3)*4+(x&3)]+.5)/16+.45*x/MW;d[(y*MW+x)*4+3]=v<p?255:0}mX.putImageData(mD,0,0);return mC}
let SCAN;function makeScan(){const b=buf(W,H),c=b.getContext('2d');c.fillStyle='rgba(0,0,0,.12)';for(let y=0;y<H;y+=4)c.fillRect(0,y,W,1);const g=c.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,W*.62);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.36)');c.fillStyle=g;c.fillRect(0,0,W,H);SCAN=b}
 
/* ================= main loop (time-based; frame rate never changes speed) ================= */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let b1=buf(2,2),b2=buf(2,2);
function size(){const dpr=Math.min(devicePixelRatio||1,2),bw=Math.max(480,Math.min(W,Math.round(Math.min(innerWidth,innerHeight*16/9)*dpr)));if(bw===cv.width)return;cv.width=bw;cv.height=Math.round(bw*9/16)}
function step(dt){T+=dt;checkTimer();if(!NXT&&!LOCK&&T>=chEnd&&!MUS.busy())startSwitch();
 if(WAIT){if(WAIT.at<0){const p=MUS.poll();if(p)WAIT.at=T+Math.max(0,p.tx-MUS.now())}if(WAIT.at>=0&&T>=WAIT.at){const k=WAIT.key;WAIT=null;beginSwitch(k)}}
 CUR.sim.step(T);if(NXT){NXT.sim.step(T);if(T-disT0>=DIS){CUR=NXT;NXT=null;chEnd=T+hold();TTL.k=CUR.key;TTL.t0=-1}}stepCards()}
function draw(){const s=cv.width/W;
 if(!NXT){ctx.setTransform(s,0,0,s,0,0);ctx.imageSmoothingEnabled=true;CUR.sim.draw(ctx,T)}
 else{for(const b of[b1,b2])if(b.width!==cv.width||b.height!==cv.height){b.width=cv.width;b.height=cv.height}
  for(const [b,sim] of [[b1,CUR.sim],[b2,NXT.sim]]){const x=b.getContext('2d');x.setTransform(s,0,0,s,0,0);x.imageSmoothingEnabled=true;sim.draw(x,T)}
  const x=b2.getContext('2d');x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='destination-in';x.imageSmoothingEnabled=false;x.drawImage(ditherMask(Math.min(1,(T-disT0)/DIS)),0,0,b2.width,b2.height);x.globalCompositeOperation='source-over';
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(b1,0,0);ctx.drawImage(b2,0,0)}
 ctx.setTransform(s,0,0,s,0,0);drawTitle(ctx);drawClock(ctx);ctx.drawImage(SCAN,0,0,W,H);bootOver(ctx)}
/* controls: hidden until mouse move or tap, fade after 3 s */
const ui=document.getElementById('ui'),pp=document.getElementById('pp'),fsb=document.getElementById('fs'),nx=document.getElementById('nx'),pv=document.getElementById('pv');let hideT=0,paused=false;
function poke(){if(BOOT.on)return;ui.classList.add('show');document.body.classList.remove('idle');clearTimeout(hideT);hideT=setTimeout(()=>{ui.classList.remove('show');document.body.classList.add('idle')},3000)}
function togglePause(){paused=!paused;pp.textContent=paused?'Play':'Pause';MUS.pause(paused)}
const de=document.documentElement,canFS=!!(de.requestFullscreen||de.webkitRequestFullscreen);
function toggleFS(){if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else(de.requestFullscreen||de.webkitRequestFullscreen).call(de)}
if(!canFS)fsb.hidden=true;pp.onclick=togglePause;fsb.onclick=toggleFS;nx.onclick=()=>startSwitch(null,1);pv.onclick=()=>startSwitch(null,-1);
addEventListener('mousemove',poke);addEventListener('pointerdown',poke);
addEventListener('keydown',e=>{poke();const k=e.key.toLowerCase();if(e.key===' '){togglePause();e.preventDefault()}else if(k==='f'&&canFS)toggleFS();else if(k==='m')soundButton();else if(k==='t')timerButton();else if(k==='n'||e.key==='ArrowRight')startSwitch(null,1);else if(k==='p'||e.key==='ArrowLeft')startSwitch(null,-1)});
document.body.classList.add('idle');addEventListener('resize',size);
const fpsEl=document.getElementById('fps');if(Q.has('fps'))fpsEl.hidden=false;
let last=0,lastDraw=0,fc=0,fw=0,cost=0;
function tick(now){requestAnimationFrame(tick);if(!last)last=now;const dt=Math.min(.05,(now-last)/1000);last=now;
 if(BOOT.on&&BOOT.out<0){drawBoot(now/1000);return}
 if(paused){if(now-lastDraw>=250){lastDraw=now;draw()}return}
 const t0=performance.now();step(dt);draw();lastDraw=now;
 if(!fpsEl.hidden){cost+=performance.now()-t0;fc++;fw+=dt;if(fw>=1){fpsEl.textContent=`${Math.round(fc/fw)} fps · ${(cost/fc).toFixed(1)} ms · ${(NXT||CUR).key}`;fc=0;fw=0;cost=0}}}
// capture hooks: ?manual stops the loop; advance(seconds) steps at 60 Hz then draws one frame
window.advance=(sec,hz=60)=>{const n=Math.round(sec*hz);for(let i=0;i<n;i++)step(1/hz);draw()};
window.CDROM={state:()=>({T:+T.toFixed(1),ch:CUR.key,next:NXT&&NXT.key,card:CM.card&&CM.card.id,cs:CM.state,duds:CUR.sim.duds.length,bag:CM.bag.length}),next:k=>startSwitch(k)};
size();
window.ready=Promise.race([Promise.all(['124px Jq','700 110px Pix','112px VT','52px VT','48px VT','52px Atk','700 56px Atk','44px Mono','700 46px Mono'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,3000))])
 .then(()=>{bootLoading();return new Promise(r=>setTimeout(r,50))}).then(()=>{makeContour();makeScan();makeD3();makeMazeTex();CUR={key:LOCK||ORDER[0]};CUR.sim=make(CUR.key);TTL.k=CUR.key;TTL.t0=-1;CUR.sim.spawn({ant:'V',eyes:'normal',mouth:'flat',legs:'spider',pal:'yellow'},true);chEnd=hold();
  for(const c of ACTIVE)cardLayout(c);if(!Q.has('manual'))requestAnimationFrame(tick);else draw()});
</script></body></html>
